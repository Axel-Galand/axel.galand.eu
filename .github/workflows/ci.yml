name: CI

on:
  push:
    branches: [main]
  pull_request:
  # gitleaks-action only scans the full history on these two events; a push scans its commits.
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  # gitleaks-action lists the PR commits through the API.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR runs are cancelled: a run on main may be about to deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      PAYLOAD_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --max-warnings=0
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:int
      - run: pnpm build

  deploy:
    needs: check
    # Skipped until the Coolify app exists and its URL and UUID are set as repository variables.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.COOLIFY_URL != '' && vars.COOLIFY_APP_UUID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Coolify deployment
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUID&force=false"

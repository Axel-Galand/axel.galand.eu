name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run, to notice dependency or toolchain drift even without commits.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR runs are cancelled: a run on main may be about to deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      PAYLOAD_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gitleaks CLI scans the whole history on every run. gitleaks-action only scans the pushed
      # range, which fails (and scans nothing) when a push contains the root commit.
      - name: Scan the full history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --max-warnings=0
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:int
      - run: pnpm build

  deploy:
    needs: check
    # Skipped until the Coolify app exists and its URL and UUID are set as repository variables.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.COOLIFY_URL != '' && vars.COOLIFY_APP_UUID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Coolify deployment
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUID&force=false"

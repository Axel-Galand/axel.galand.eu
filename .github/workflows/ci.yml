name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      PAYLOAD_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --max-warnings=0
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:int
      - run: pnpm build

  deploy:
    needs: check
    # Skipped until the Coolify app exists and its UUID is set as a repository variable.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.COOLIFY_APP_UUID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Coolify deployment
        env:
          COOLIFY_URL: https://coolify.axel.galand.eu
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        run: |
          curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUID&force=false"
